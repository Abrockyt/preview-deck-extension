<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Preview Deck</title>
<style>
:root{
  --ink-1:#12151a; --ink-3:#656e7a;
  --surface:#ffffff; --sunken:#eef0f3;
  --accent:#2563eb; --accent-ink:#1d4ed8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;width:268px;padding:15px;background:var(--surface);color:var(--ink-1);
  font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased;
}
.head{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.mark{
  width:18px;height:18px;border-radius:6px;flex:none;
  background:linear-gradient(140deg,#60a5fa,#2563eb);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
}
h1{margin:0;font-size:14px;font-weight:640;letter-spacing:-.012em}
p{margin:0 0 13px;color:var(--ink-3);font-size:12px;line-height:1.55}
button{
  width:100%;min-height:38px;border-radius:8px;border:1px solid var(--accent);
  background:var(--accent);color:#fff;font:580 13px var(--sans);cursor:pointer;
  transition:background .16s cubic-bezier(.32,.72,0,1);
}
button:hover{background:var(--accent-ink)}
.hint{
  margin-top:11px;padding:8px 9px;border-radius:7px;background:var(--sunken);
  color:var(--ink-3);font-family:var(--mono);font-size:10.5px;line-height:1.5;
}
</style>
</head>
<body>
  <div class="head">
    <i class="mark"></i>
    <h1>Preview Deck</h1>
  </div>
  <p>Element tagging with React source file:line for your local dev server.</p>
  <button id="open">Open Preview Deck</button>
  <div class="hint">Works on http://localhost and http://127.0.0.1 only. Screenshots aren't available in the Firefox build — see the sidebar for why.</div>
  <script src="popup.js"></script>
</body>
</html>
